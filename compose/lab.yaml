x-environment: &lab-environment
  LAB_INSTANCE: ${LAB_INSTANCE:?}
  LAB_DATABASE_URL: postgresql://lab:${LAB_DB_PASSWORD:?}@postgres:5432/lab
  LAB_REDIS_URL: redis://redis:6379/0
  LAB_DIAGNOSTIC_KEY: ${LAB_DIAGNOSTIC_KEY:?}
  LAB_WORKER_VERSION: v1
services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?}
      POSTGRES_DB: lab
    volumes: [lab-data:/var/lib/postgresql/data]
    labels: {io.opslens.scope: lab}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    command: [redis-server, --appendonly, "yes"]
    volumes: [queue-data:/data]
    labels: {io.opslens.scope: lab}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: opslens-lab:0.1.1
    build:
      context: ..
      dockerfile: docker/Dockerfile.lab
    environment: *lab-environment
    command: [python, -m, uvicorn, lab.app:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${LAB_HTTP_PORT:?}:8000"]
    labels: {io.opslens.scope: lab}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 30
  worker:
    image: opslens-lab:0.1.1
    environment: *lab-environment
    command: [python, -m, lab.worker]
    labels: {io.opslens.scope: lab}
    depends_on:
      api: {condition: service_healthy}
  blocker:
    image: opslens-lab:0.1.1
    environment:
      <<: *lab-environment
      BLOCK_JOB_ID: ${BLOCK_JOB_ID:-00000000-0000-0000-0000-000000000000}
    command: [python, -m, lab.blocker]
    labels: {io.opslens.scope: lab}
    profiles: [fault-tools]
    depends_on:
      api: {condition: service_healthy}
volumes:
  lab-data:
  queue-data:
